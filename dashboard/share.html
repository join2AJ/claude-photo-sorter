<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f4">
<title>My photos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23c2412f'/%3E%3Ccircle cx='12' cy='10' r='4' fill='white'/%3E%3Cpath d='M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="share.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <span class="brand"><i class="logo"></i>My photos</span>
    <span class="spacer"></span>
    <span class="test" id="test" hidden>Test mode</span>
    <button class="icon-btn" id="theme" aria-label="Switch theme"></button>
    <button class="icon-btn" id="menu" aria-label="Settings" hidden></button>
  </header>
  <ol class="steps" id="steps" aria-label="Progress"></ol>
  <main id="screen" class="screen"></main>
  <footer class="foot" id="foot">Photos are prepared for you on the album owner's computer. Faces of people who haven't agreed are blurred before they reach you.</footer>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status"></div>
<script src="share.js"></script>
</body>
</html>
